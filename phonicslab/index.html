<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phonics Lab — English Pronunciation</title>
<style>
:root {
  --bg:#f4f7fb; --panel:#ffffff; --ink:#172033; --muted:#718096;
  --primary:#635bff; --primary2:#5148e8; --line:#e6eaf1;
  --soft:#f0efff; --shadow:0 14px 40px rgba(27,39,73,.09);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{padding:34px 20px 76px;background:radial-gradient(circle at 85% 20%,#8c86ff 0,transparent 28%),linear-gradient(135deg,#171d35,#38317e);color:#fff}
.top{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
.header-left{flex:1}
.badge{display:inline-flex;padding:7px 11px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.09);border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.5px}
h1{font-size:clamp(32px,5vw,56px);line-height:1;margin:16px 0 12px;letter-spacing:-1.8px}
header p{max-width:680px;margin:0;color:#dfe2ff;font-size:16px}

/* Logo placeholder a la derecha */
.logo-placeholder {
  font-weight: 700;
  letter-spacing: 1px;
  color: #fff;
  min-width: 100px;
  text-align: center;
  backdrop-filter: blur(4px);
  /* Reemplaza este bloque por tu imagen o SVG */
}
.logo-placeholder img {
  max-height: 130px;
  display: block;
}

.panel{max-width:1180px;margin:-44px auto 0;padding:0 20px;position:relative}
.controls{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;border:0;background:#f6f7fa;border-radius:14px;padding:14px 16px;font-size:16px;outline:0;color:var(--ink)}
main{max-width:1180px;margin:24px auto;padding:0 20px}
.meta{display:flex;justify-content:space-between;align-items:center;margin:18px 0 14px;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:0 7px 25px rgba(27,39,73,.055);transition:.18s transform,.18s box-shadow}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.visual{height:86px;border-radius:16px;background:linear-gradient(145deg,#f5f4ff,#eef4ff);display:flex;align-items:center;justify-content:center;font-size:52px;margin-bottom:14px}
.word{font-size:29px;font-weight:850;letter-spacing:-.7px;text-align:center}
.sub{text-align:center;color:var(--muted);font-size:12px;margin:5px 0 14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions button{border:0;border-radius:12px;padding:10px 7px;font-weight:800;cursor:pointer}
.normal{background:var(--soft);color:var(--primary)}
.slow{background:#f4f5f7;color:#394150}
button:hover{filter:brightness(.97)}
.status{min-height:20px;text-align:center;color:var(--primary);font-weight:700;font-size:13px;margin:15px 0}
.empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:20px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:35px 20px}
@media(max-width:650px){
 .controls{padding:12px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .card{padding:11px;border-radius:17px} .visual{height:68px;font-size:39px}
 .word{font-size:23px} .sub{margin-bottom:10px}
 .actions{grid-template-columns:1fr}
 .logo-placeholder{font-size:14px;padding:18px 30px}
}
</style>
</head>
<body>
<header>
<div class="top">
  <div class="header-left">
    <span class="badge">UNIVERSAL ENGLISH CENTER | A1 · STARTER</span>
    <h1>Phonics Lab</h1>
    <p>Practice: <b>Phonics for Beginners</b>. Listening and Pronunciation</p>
  </div>
  <div class="logo-placeholder">
    <!-- Reemplaza este contenido con tu logo (ej: <img src="logo.png" alt="Logo">) -->
    <img src="uec-logo-png.png" alt="Logo">
  </div>
</div>
</header>

<div class="panel">
<div class="controls">
<div class="search"><input id="search" type="search" placeholder="Type to search for a word..." autocomplete="off" autofocus></div>
<!-- Eliminados el select de velocidad y el botón Stop -->
</div>
</div>

<main>
<div class="meta"><span id="count"></span><span id="status"></span></div>
<section id="grid" class="grid"></section>
</main>

<footer>Phonics for Beginners · UEC 2026</footer>

<script>
const words = ["cap", "bat", "bag", "star", "map", "cat", "sad", "van", "man", "lab", "car", "lamb", "egg", "pet", "men", "clerk", "pen", "ten", "desk", "belt", "tent", "nest", "dress", "leg", "pig", "list", "six", "pin", "king", "mist", "kid", "kit", "hill", "bill", "pill", "big", "box", "pot", "block", "son", "boss", "top", "mop", "stop", "dog", "fox", "rock", "lock", "umbrella", "bug", "tub", "pump", "gum", "sun", "run", "cub", "rug", "hug", "nut", "cup", "table", "cake", "say", "day", "play", "make", "lake", "snake", "baby", "tape", "mail", "grape", "seal", "bee", "feet", "jeans", "jeep", "sea", "meat", "teeth", "eat", "week", "people", "beast", "bike", "ride", "like", "time", "write", "bite", "five", "climb", "finally", "pie", "hive", "mice", "nose", "boat", "coat", "note", "show", "bow", "bone", "go", "rope", "hope", "bowl", "rose", "use", "tube", "glue", "music", "ruler", "flute", "mule", "puma", "rule", "cute", "mute", "blue", "candle", "apple", "bottle", "marble", "eagle", "whistle", "turtle", "bubble", "little", "paddle", "face", "celery", "ice", "fence", "race", "clock", "class", "cone", "come", "gym", "page", "giraffe", "cage", "orange", "large", "game", "goat", "give", "gold", "grapes", "frog", "tree", "trumpet", "train", "truck", "drum", "fruit", "grass", "trip", "price", "plant", "slippers", "glass", "flat", "cloud", "glad", "plate", "plane", "fly", "spoon", "stamp", "slide", "sled", "smoke", "snow", "strawberry", "sleep", "speak", "study", "swing", "mask", "raft", "hands", "tank", "trunk", "milk", "ring", "shark", "sandy", "funny", "happy", "every", "puppy", "sunny", "windy", "cloudy", "rainy", "scary", "cry", "try", "sky", "shy", "dry", "bark", "dreamer", "rider", "shirt", "skirt", "sir", "store", "work", "world", "faster", "bigger", "taller", "better", "busier", "colder", "hottest", "shortest", "smallest", "newest", "prettiest", "cheapest", "connection", "action", "attention", "selection", "intention", "direction", "happiness", "lateness", "illness", "fitness", "business", "sadness", "colorful", "painful", "helpful", "useful", "cheerful", "successful", "homeless", "careless", "worthless", "cheerless", "useless", "endless", "heavy", "sweater", "leather", "bread", "breakfast", "weather", "draw", "August", "pause", "claws", "hawk", "haul", "house", "flowers", "towel", "shower", "owl", "boil", "soil", "boy", "point", "oil", "toy", "new", "few", "flew", "chew", "crew", "stew", "hood", "room", "moon", "cook", "zoo", "look"];

const emoji = {
cap:"🧢",bat:"🦇",bag:"👜",star:"⭐",map:"🗺️",cat:"🐱",sad:"😢",van:"🚐",man:"👨",car:"🚗",lamb:"🐑",
egg:"🥚",pet:"🐶",pen:"🖊️",desk:"🪑",belt:"👔",tent:"⛺",pig:"🐷",king:"👑",kid:"🧒",hill:"⛰️",box:"📦",
dog:"🐶",fox:"🦊",rock:"🪨",lock:"🔒",umbrella:"☂️",bug:"🐞",tub:"🛁",sun:"☀️",cup:"☕",cake:"🍰",
baby:"👶",mail:"✉️",grape:"🍇",bee:"🐝",feet:"🦶",jeans:"👖",jeep:"🚙",sea:"🌊",meat:"🥩",teeth:"🦷",
bike:"🚲",pie:"🥧",mice:"🐭",boat:"⛵",rose:"🌹",music:"🎵",flute:"🪈",blue:"🔵",apple:"🍎",candle:"🕯️",
eagle:"🦅",turtle:"🐢",whistle:"📣",bubble:"🫧",face:"🙂",ice:"🧊",clock:"⏰",class:"🏫",gym:"🏋️",
giraffe:"🦒",orange:"🍊",game:"🎮",gold:"🥇",grapes:"🍇",frog:"🐸",tree:"🌳",train:"🚆",truck:"🚚",
drum:"🥁",grass:"🌿",plant:"🪴",slippers:"🥿",glass:"🥛",cloud:"☁️",plane:"✈️",fly:"🪰",spoon:"🥄",
stamp:"📮",slide:"🛝",snow:"❄️",strawberry:"🍓",sleep:"😴",study:"📖",swing:"🎠",mask:"😷",milk:"🥛",
ring:"💍",shark:"🦈",funny:"😂",puppy:"🐕",rainy:"🌧️",shirt:"👕",skirt:"👗",store:"🏪",world:"🌍",
heavy:"🏋️",sweater:"🧥",leather:"👜",bread:"🍞",breakfast:"🍳",weather:"🌤️",draw:"✏️",August:"📅",
house:"🏠",flowers:"💐",shower:"🚿",owl:"🦉",boy:"👦",oil:"🛢️",toy:"🧸",new:"🆕",few:"🔢",room:"🚪",
moon:"🌙",cook:"👨‍🍳",zoo:"🦁"
};

const grid=document.getElementById('grid'), search=document.getElementById('search');
const count=document.getElementById('count'), status=document.getElementById('status');

function speak(word, rate){
  if(!('speechSynthesis' in window)){ alert('Tu navegador no permite la voz.'); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(word);
  u.lang='en-US'; u.rate=rate; u.pitch=1;
  const voices=speechSynthesis.getVoices();
  const voice=voices.find(v=>/^en-US$/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang));
  if(voice) u.voice=voice;
  u.onstart=()=>status.textContent='🔊 Listening: '+word+(rate<0.6?' · lento':'');
  u.onend=()=>status.textContent='';
  speechSynthesis.speak(u);
}

function render(){
  const q=search.value.trim().toLowerCase();
  const list=words.filter(w=>w.toLowerCase().includes(q));
  count.textContent=`${list.length} words`;
  if(!list.length){grid.innerHTML='<div class="empty">No encontramos esa palabra.</div>';return;}
  grid.innerHTML=list.map(w=>`
    <article class="card">
      <div class="visual">${emoji[w]||'🖼️'}</div>
      <div class="word">${w}</div>
      <div class="sub">English · US</div>
      <div class="actions">
        <button class="normal" data-w="${w}">🔊 Escuchar</button>
        <button class="slow" data-s="${w}">🐌 Lento</button>
      </div>
    </article>
  `).join('');
  grid.querySelectorAll('.normal').forEach(b=>b.onclick=()=>speak(b.dataset.w,0.78));
  grid.querySelectorAll('.slow').forEach(b=>b.onclick=()=>speak(b.dataset.s,0.42));
}
search.addEventListener('input',render);
render();
</script>
</body>
</html>
